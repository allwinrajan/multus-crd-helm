apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-multus-ds
  namespace: kube-system
  labels:
    app: multus-cni
spec:
  selector:
    matchLabels:
      app: multus-cni
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: multus-cni
    spec:
      hostNetwork: true
      serviceAccountName: {{ .Values.serviceAccount.name }}

      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}

      volumes:
        - name: cni-bin-dir
          hostPath:
            path: /opt/cni/bin
        - name: cni-conf-dir
          hostPath:
            path: /etc/cni/net.d
        - name: multus-kubeconfig
          hostPath:
            path: /etc/cni/net.d/multus.d
            type: DirectoryOrCreate
        - name: multus-cfg
          configMap:
            name: multus-cni-config
        - name: multus-workdir
          emptyDir: {}

      initContainers:
        - name: extract-multus-binary
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command:
            - /bin/sh
            - -c
            - |
              echo "[INIT] Searching for multus binary..."
              BIN=""
              for p in /usr/local/bin/multus /usr/src/multus-cni/bin/multus /bin/multus; do
                if [ -f "$p" ]; then BIN=$p; break; fi
              done
              if [ -z "$BIN" ]; then echo "[ERROR] NO MULTUS BINARY FOUND" && exit 1; fi
              echo "[INIT] Found multus at $BIN"
              cp $BIN /workdir/multus
              chmod +x /workdir/multus
              echo "[SUCCESS] Copy done"
          volumeMounts:
            - name: multus-workdir
              mountPath: /workdir

        - name: install-multus-binary
          image: busybox
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /host/opt/cni/bin/
              cp /workdir/multus /host/opt/cni/bin/
              chmod +x /host/opt/cni/bin/multus
              echo "[SUCCESS] Installed multus to host"
          volumeMounts:
            - name: multus-workdir
              mountPath: /workdir
            - name: cni-bin-dir
              mountPath: /host/opt/cni/bin

        - name: write-multus-conf
          image: busybox
          command:
            - /bin/sh
            - -c
            - |
              echo "[INIT] Writing Multus top config..."
              cat /multus-cfg/cni-conf.json > /host/etc/cni/net.d/{{ .Values.multusCniConfFile }}
              echo "[SUCCESS] Config written"
          volumeMounts:
            - name: cni-conf-dir
              mountPath: /host/etc/cni/net.d
            - name: multus-cfg
              mountPath: /multus-cfg

      containers:
        - name: kube-multus
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /entrypoint.sh
          args:
            - "--multus-conf-file=auto"
            - "--multus-autoconfig-dir=/host/etc/cni/net.d"
            - "--cni-version=0.3.1"
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            privileged: true
          volumeMounts:
            - name: cni-bin-dir
              mountPath: /host/opt/cni/bin
            - name: cni-conf-dir
              mountPath: /host/etc/cni/net.d
            - name: multus-kubeconfig
              mountPath: /etc/cni/net.d/multus.d